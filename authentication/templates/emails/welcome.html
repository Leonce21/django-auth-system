<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 8px; }
        .header { text-align: center; margin-bottom: 30px; color: #059669; }
        .footer { text-align: center; color: #6b7280; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to {{ site_name }}!</h1>
        </div>
        <p>Hello {{ first_name }},</p>
        <p>Your email has been verified successfully. Welcome to our platform!</p>
        <p>You can now log in and access all features.</p>
        <div class="footer">
            <p>&copy; {{ site_name }}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
